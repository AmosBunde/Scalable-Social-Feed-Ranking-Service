
x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/base-python.Dockerfile
  environment: &common-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: social_feed
    POSTGRES_USER: feed_user
    POSTGRES_PASSWORD: dev-password
    REDIS_HOST: redis
    REDIS_PORT: 6379
    LOG_LEVEL: INFO
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  networks:
    - sfr-network
  restart: unless-stopped

services:
  # --- Application Services ---
  api-gateway:
    <<: *python-service
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "${HOST_GATEWAY_PORT:-8000}:8000"
    environment:
      <<: *common-env
      GATEWAY_PORT: 8000
      # dev-token bypass only activates in development (see jwt_handler.py)
      ENVIRONMENT: development
      JWT_SECRET: dev-secret-change-in-production-0
      CORS_ORIGINS: http://localhost:3000
      FEED_SERVICE_URL: http://feed-service:8001
      USER_PROFILE_URL: http://user-profile:8003

  feed-service:
    <<: *python-service
    build:
      context: .
      dockerfile: services/feed_service/Dockerfile
    ports:
      - "${HOST_FEED_PORT:-8001}:8001"
    environment:
      <<: *common-env
      FEED_SERVICE_PORT: 8001
      RANKING_ENGINE_URL: http://ranking-engine:8002
      USER_PROFILE_URL: http://user-profile:8003
      CONTENT_INGESTION_URL: http://content-ingestion:8004

  ranking-engine:
    <<: *python-service
    build:
      context: .
      dockerfile: services/ranking_engine/Dockerfile
    ports:
      - "${HOST_RANKING_PORT:-8002}:8002"
    environment:
      <<: *common-env
      RANKING_ENGINE_PORT: 8002
      RANKING_MODEL_PATH: /models/xgboost_v1.json

  user-profile:
    <<: *python-service
    build:
      context: .
      dockerfile: services/user_profile/Dockerfile
    ports:
      - "${HOST_PROFILE_PORT:-8003}:8003"
    environment:
      <<: *common-env
      USER_PROFILE_PORT: 8003

  content-ingestion:
    <<: *python-service
    build:
      context: .
      dockerfile: services/content_ingestion/Dockerfile
    ports:
      - "${HOST_INGESTION_PORT:-8004}:8004"
    environment:
      <<: *common-env
      CONTENT_INGESTION_PORT: 8004

  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_feed
      POSTGRES_USER: feed_user
      POSTGRES_PASSWORD: dev-password
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed_user -d social_feed"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sfr-network

  redis:
    image: redis:7-alpine
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sfr-network

  kafka:
    image: apache/kafka:3.7.2
    ports:
      - "${HOST_KAFKA_PORT:-9092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${HOST_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - sfr-network

  # --- Observability ---
  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "${HOST_JAEGER_UI_PORT:-16686}:16686"  # UI
      - "${HOST_OTLP_PORT:-4317}:4317"    # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - sfr-network

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "${HOST_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sfr-network

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "${HOST_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - sfr-network

volumes:
  postgres_data:

networks:
  sfr-network:
    driver: bridge
