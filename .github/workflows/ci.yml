name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the build job alone gets packages:write
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/amosbunde/sfr  # image refs must be lowercase

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check services/
      - name: Ruff format check
        run: ruff format --check services/
      - name: MyPy
        run: mypy services/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest services/ -v --cov=services --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      # conftest imports the real service apps as `services.*` packages
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start test infrastructure
        # Isolated Postgres/Redis/Kafka stack on non-default host ports
        # (55432/56379/19092); --wait blocks until healthchecks pass.
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Run integration tests
        # -rs lists every skip in the short summary; tee keeps the output
        # for the skip-guard below. pipefail preserves pytest's exit code.
        run: |
          set -o pipefail
          pytest tests/integration -q -rs | tee integration-test-output.log
      - name: Fail if container-backed tests were skipped
        # The container-backed tests (@pytest.mark.integration) skip
        # themselves when the compose stack is unreachable, which would
        # otherwise turn an infra failure into a green job. Green must mean
        # "ran against real containers", so:
        #   1. assert integration-marked tests still exist (collection guard)
        #   2. assert the run reported zero skips of any kind
        run: |
          marked=$(pytest tests/integration -m integration --collect-only -q 2>/dev/null | grep -c '::' || true)
          if [ "$marked" -eq 0 ]; then
            echo "::error::No @pytest.mark.integration tests were collected; the container-backed suite is gone or mis-marked."
            exit 1
          fi
          echo "Collected $marked integration-marked tests."
          if grep -qE '[0-9]+ skipped' integration-test-output.log; then
            echo "::error::Integration tests were SKIPPED. The docker-compose.test.yml containers were not detected; see the -rs summary above."
            exit 1
          fi
          echo "No skips detected: the suite ran against the real containers."
      - name: Tear down test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  k8s-validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render all kustomizations
        run: |
          for d in k8s/base k8s/overlays/dev k8s/overlays/staging k8s/overlays/prod k8s/istio; do
            echo "--- rendering $d"
            kubectl kustomize "$d" > /dev/null
          done

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push images to GHCR
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - api_gateway
          - feed_service
          - ranking_engine
          - content_ingestion
          - user_profile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    # Requires a reachable cluster: set repo variable DEPLOY_TO_DEV=true and
    # secret KUBE_CONFIG (base64 kubeconfig). Skipped otherwise so the
    # pipeline stays green for repos without a dev cluster.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_DEV == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy with Kustomize
        run: |
          kubectl kustomize k8s/overlays/dev | kubectl apply -f -
