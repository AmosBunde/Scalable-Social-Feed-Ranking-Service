name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the build job alone gets packages:write
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/amosbunde/sfr  # image refs must be lowercase

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check services/
      - name: Ruff format check
        run: ruff format --check services/
      - name: MyPy
        run: mypy services/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest services/ -v --cov=services --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push images to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - api_gateway
          - feed_service
          - ranking_engine
          - content_ingestion
          - user_profile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    # Requires a reachable cluster: set repo variable DEPLOY_TO_DEV=true and
    # secret KUBE_CONFIG (base64 kubeconfig). Skipped otherwise so the
    # pipeline stays green for repos without a dev cluster.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_DEV == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy with Kustomize
        run: |
          kubectl kustomize k8s/overlays/dev | kubectl apply -f -
