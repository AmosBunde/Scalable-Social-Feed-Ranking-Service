apiVersion: v1
kind: Namespace
metadata:
  name: social-feed
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: social-feed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: ghcr.io/amosbunde/scalable-social-feed-ranking-service/api-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: GATEWAY_PORT
              value: "8000"
            - name: FEED_SERVICE_URL
              value: "http://feed-service:8001"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: social-feed
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-service
  namespace: social-feed
spec:
  replicas: 3
  selector:
    matchLabels:
      app: feed-service
  template:
    metadata:
      labels:
        app: feed-service
    spec:
      serviceAccountName: feed-service
      containers:
        - name: feed-service
          image: ghcr.io/amosbunde/scalable-social-feed-ranking-service/feed-service:latest
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: feed-service
  namespace: social-feed
spec:
  selector:
    app: feed-service
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-engine
  namespace: social-feed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ranking-engine
  template:
    metadata:
      labels:
        app: ranking-engine
    spec:
      serviceAccountName: ranking-engine
      containers:
        - name: ranking-engine
          image: ghcr.io/amosbunde/scalable-social-feed-ranking-service/ranking-engine:latest
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ranking-engine
  namespace: social-feed
spec:
  selector:
    app: ranking-engine
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feed-service-hpa
  namespace: social-feed
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: feed-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ranking-engine-hpa
  namespace: social-feed
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ranking-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
