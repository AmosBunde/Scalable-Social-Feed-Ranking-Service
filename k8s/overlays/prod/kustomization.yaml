apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production: higher floor for the edge and stateless workers. The
# feed-service and ranking-engine floors/ceilings are governed by their
# HPAs; pin image tags to a specific <sha> here when promoting a build.
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api-gateway
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: user-profile
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: content-ingestion
