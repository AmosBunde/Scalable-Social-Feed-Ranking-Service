# Dedicated ServiceAccounts give every workload its own SPIFFE identity
# (cluster.local/ns/social-feed/sa/<name>) so AuthorizationPolicies can
# authorize callers by mTLS principal instead of by namespace.
#
# k8s/base/deployments.yaml sets serviceAccountName on each Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feed-service
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ranking-engine
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-profile
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: content-ingestion
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
