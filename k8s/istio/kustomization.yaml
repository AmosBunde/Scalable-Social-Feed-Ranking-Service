apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Istio service mesh configuration for the social-feed namespace.
# Apply on top of k8s/base (or an overlay):
#   kubectl apply -k k8s/base && kubectl apply -k k8s/istio
resources:
  - service-accounts.yaml
  - gateway.yaml
  - virtual-services.yaml
  - destination-rules.yaml
  - peer-authentication.yaml
  - authorization-policies.yaml
  - kiali/kiali-deployment.yaml
  # Opt-in canary traffic split for ranking-engine. It replaces the default
  # ranking-engine VirtualService, so it must NOT be enabled at the same
  # time as virtual-services.yaml's route. See README.md before enabling.
  # - ranking-engine-canary.yaml
