# DestinationRules for every service in the social-feed mesh.
#
# Every rule enforces:
#   - ISTIO_MUTUAL TLS (client side of the STRICT mTLS enforced by
#     peer-authentication.yaml)
#   - connection pooling sized against each service's HPA/replica profile
#   - outlier detection (circuit breaking): pods returning consecutive
#     5xx responses are ejected from the load-balancing pool.
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-gateway
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
spec:
  host: api-gateway.social-feed.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
        maxRequestsPerConnection: 100
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: feed-service
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
spec:
  host: feed-service.social-feed.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 300
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 150
        http2MaxRequests: 300
        maxRequestsPerConnection: 100
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ranking-engine
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
spec:
  host: ranking-engine.social-feed.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 500ms
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 50
        maxRetries: 3
    outlierDetection:
      # Ranking is CPU-heavy; eject misbehaving pods aggressively so the
      # HPA-backed pool keeps p99 latency stable.
      consecutive5xxErrors: 3
      interval: 15s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
  # Subsets used by the canary traffic-split example
  # (ranking-engine-canary.yaml). Harmless while only the stable
  # deployment exists.
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: user-profile
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
spec:
  host: user-profile.social-feed.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 100
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: content-ingestion
  namespace: social-feed
  labels:
    app.kubernetes.io/part-of: social-feed
spec:
  host: content-ingestion.social-feed.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 100
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
