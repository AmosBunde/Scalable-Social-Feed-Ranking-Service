global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
  - job_name: 'feed-service'
    static_configs:
      - targets: ['feed-service:8001']
  - job_name: 'ranking-engine'
    static_configs:
      - targets: ['ranking-engine:8002']
  - job_name: 'user-profile'
    static_configs:
      - targets: ['user-profile:8003']
  - job_name: 'content-ingestion'
    static_configs:
      - targets: ['content-ingestion:8004']
